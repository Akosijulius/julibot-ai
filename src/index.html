<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JULIBOT — Your Everyday AI Assistant</title>
    <link rel="icon" type="image/png" href="assets/julibot-logo.png">
    <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

    <div id="welcomeContainer" class="auth-container">
        <div class="auth-card welcome-card">
            <img src="assets/julibot-logo.png" alt="JULIBOT" class="logo">
            <h1>JULIBOT</h1>
            <p class="tagline">Welcome to JULIBOT — Your daily chat assistant</p>

            <button id="welcomeGuestBtn" class="btn btn-guest">Continue as Guest</button>
            <div class="auth-divider"><span>or</span></div>
            <button id="welcomeLoginBtn" class="btn">Login</button>
        </div>
    </div>

    <div id="authContainer" class="auth-container" style="display:none;">
        <div class="auth-card">
            <img src="assets/julibot-logo.png" alt="JULIBOT" class="logo">
            <h1>JULIBOT</h1>
            <p class="tagline">Your Everyday AI Assistant</p>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Sign Up</button>
            </div>

            <div id="authError" class="auth-error"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Username or Email</label>
                    <input type="text" id="loginEmail" placeholder="Username or email" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn">Login</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="registerUsername">Username</label>
                    <input type="text" id="registerUsername" placeholder="Create username" required minlength="3" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" placeholder="Email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="Create password" required minlength="8" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="registerConfirmPassword">Confirm Password</label>
                    <input type="password" id="registerConfirmPassword" placeholder="Confirm password" required autocomplete="new-password">
                </div>
                <div id="passwordMismatch" class="field-error">Passwords do not match</div>
                <button type="submit" class="btn">Create Account</button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span>or</span>
            </div>

            <!-- Google Sign-In -->
            <button id="googleLoginBtn" class="btn btn-google">
                <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>

            <p class="auth-back"><a href="#" id="backToWelcome">← Back</a></p>
        </div>
    </div>

    <div id="chatContainer" class="chat-container">

        <!-- Guest Banner -->
        <div id="guestBanner" class="guest-banner" style="display:none;">
            <span>You're browsing as a guest — conversations won't be saved.</span>
            <button id="bannerSignupBtn" class="banner-btn">Sign Up Free</button>
            <button id="bannerDismissBtn" class="banner-dismiss" aria-label="Dismiss">✕</button>
        </div>

        <div class="chat-with-sidebar">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="brand">
                        <img src="assets/julibot-logo.png" alt="JULIBOT">
                        <span>JULIBOT</span>
                    </div>
                    <button class="new-chat-btn" id="newChatBtn">+ New Conversation</button>
                </div>

                <div class="conversations-list" id="conversationsList"></div>

                <div class="sidebar-footer">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">J</div>
                        <span class="user-email" id="userEmail"></span>
                    </div>
                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>
            </aside>

            <!-- Main Chat Area -->
            <main class="main-chat">
                <header class="chat-header">
                    <img src="assets/julibot-logo.png" alt="JULIBOT">
                </header>

                <div class="messages-container" id="messagesContainer">
                    <div class="empty-state" id="emptyState">
                        <img src="assets/julibot-logo.png" height="110" alt="JULIBOT" class="logo">
                        <h2>Welcome to JULIBOT</h2>
                        <p class="tagline">How may I help you today?</p>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <textarea
                            class="chat-input"
                            id="messageInput"
                            placeholder="Type your message…"
                            rows="1"
                            autocomplete="off"
                        ></textarea>
                        <button class="send-btn" id="sendBtn">Send</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/app.js?v=6"></script>
</body>
</html>
